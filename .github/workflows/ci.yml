name: ios-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ROVIA_ENGINE_LOCK: engines.lock.json
  # $RUNNER_TEMP, not ${{ runner.temp }}. GitHub sets RUNNER_TEMP as a real
  # environment variable for every step, and it is the only one of the two that
  # survives being read from an `env:` block: the `runner` *context* is not
  # available in a workflow-level `env` or a job-level `env` at all, only in a
  # step's `env` and inside `run`. Both levels were tried here and both made
  # GitHub reject the file with "Unrecognized named-value: 'runner'", which is a
  # 0-second run with no job created.
  #
  # The path is outside the checkout on purpose: a derived-data path inside the
  # repository makes the XCTest runner time out before running a single test,
  # because the runner process is not granted access to the protected directory.
  DERIVED_DATA: $RUNNER_TEMP/RoviaDerivedData
  # Must match CFBundleShortVersionString in client/app/ios/RoviaApp/Info.plist.
  # tools/ci/test_ci_checks.py fails if the two drift apart.
  ROVIA_MARKETING_VERSION: 0.1.0

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      # pyflakes is installed into the same virtualenv, exactly pinned, so the lint
      # gate resolves through the interpreter rather than through `uvx`. A GitHub-hosted
      # macOS runner has no `uvx`: the first hosted run failed with `FileNotFoundError:
      # [Errno 2] No such file or directory: 'uvx'`, which is a linter that could not run
      # being reported as a clean tree by anything but the exit status. `uvx` remains
      # the gate's fallback for a developer with no virtualenv, and the gate states
      # which route it used. Putting the venv's bin on PATH is what makes `python3`
      # resolve to the pinned interpreter for every later step.
      - name: Install pinned Python tooling
        run: |
          python3 -m venv .ci-schema-validator
          .ci-schema-validator/bin/python -m pip install --disable-pip-version-check \
            check-jsonschema==0.38.2 \
            pyflakes==3.2.0
          echo "$PWD/.ci-schema-validator/bin" >> "$GITHUB_PATH"
      - name: Show the resolved toolchain
        run: |
          which python3
          python3 --version
          python3 -m pyflakes --version
          python3 -c 'import check_jsonschema; print("check-jsonschema importable")'
      - name: Verify repository inputs
        run: |
          ./tools/ci/verify-lockfiles.sh
          ./tools/ci/verify-engine-checksums.sh --mode foundation --lock "$ROVIA_ENGINE_LOCK"
          ./tools/ci/verify-third-party-notices.sh
      - name: Check shell syntax
        run: ./tools/ci/check-shell-syntax.sh
      - name: Run tool tests
        run: ./tools/ci/run-tool-tests.sh
      - name: Audit accessibility identifiers
        run: |
          python3 tools/ci/audit-accessibility-identifiers.py
          python3 tools/ci/test_audit_accessibility_identifiers.py
      # The same set the record's derivation reads: every JSON file this repository
      # publishes, from `git ls-files --exclude-standard`. A `find schemas fixtures`
      # scope was narrower than the record described, and a whole-tree walk was wider
      # than anything checked - the walk counted the `.ci-schema-validator` virtualenv
      # this same workflow creates, so the recorded count was right on a laptop and
      # wrong on the runner. One definition, used by the gate, the record, and here.
      - name: Validate JSON
        run: |
          count=0
          while read -r document; do
            python3 -m json.tool "$document" >/dev/null
            count=$((count + 1))
          done < <(git ls-files --cached --others --exclude-standard '*.json' | LC_ALL=C sort)
          echo "validated $count JSON files"
          test "$count" -ge 30
          python3 tools/ci/test_validate_schemas.py
          python3 tools/ci/validate-schemas.py
      - name: Test core and engine packages
        run: |
          while read -r package; do
            case "$package" in ''|\#*) continue ;; esac
            echo "swift test --package-path $package"
            swift test --package-path "$package"
          done < tools/ci/local-packages.txt
      - name: Generate and check the SBOM
        run: |
          mkdir -p build
          python3 tools/reproducibility/generate-sbom.py . build/SBOM.spdx.json --lock "$ROVIA_ENGINE_LOCK"
          python3 tools/reproducibility/check-sbom.py build/SBOM.spdx.json --repository .
      - name: Resolve an iOS simulator
        id: simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")
          ')"
          echo "Testing on simulator $SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "ROVIA_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Test the iOS app model on a simulator
        env:
          ROVIA_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild \
            -project client/app/ios/RoviaApp.xcodeproj \
            -scheme RoviaApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$ROVIA_SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            test
      - name: Build iOS simulator target without signing
        run: |
          xcodebuild \
            -project client/app/ios/RoviaApp.xcodeproj \
            -scheme RoviaApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Verify processed bundle metadata
        run: |
          ./tools/ci/verify-bundle-metadata.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Rovia.app" \
            --expect-version "$ROVIA_MARKETING_VERSION"
      - name: Install and launch on a simulator
        env:
          ROVIA_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          ./tools/ci/verify-simulator-install.sh \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Rovia.app" \
            --device "$ROVIA_SIMULATOR_ID"
